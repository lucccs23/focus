# Testa o código do PR. Pode vir de fork: por isso o token é só de leitura e não há segredos nem cache.
name: Verificar

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verificar:
    name: verificar
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Baixar o Electron
        run: node node_modules/electron/install.js
      - name: Lint, testes, ponta a ponta e build
        run: npm run check
