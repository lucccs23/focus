<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Focus — mini</title>
<style>
  /* o tema vem do Electron (nativeTheme), via prefers-color-scheme */
  :root {
    --surface: #ffffff; --line: #e6e3dd; --text: #1f1e1c; --muted: #6b6862; --hover: #f0eee9; --track: #ece9e3;
    --c-focus: #c4623f; --c-short: #5b8a6b; --c-long: #4f6d8f; --c-watch: #a5772c; --on-accent: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1e1e1e; --line: #333333; --text: #ecebe7; --muted: #a29e97; --hover: #2a2a2a; --track: #2e2e2e;
      --c-focus: #d9805e; --c-short: #7fae8e; --c-long: #84a0c3; --c-watch: #c9a15a; --on-accent: #1b1714;
    }
  }
  body { --accent: var(--c-focus); }
  body[data-mode="short"] { --accent: var(--c-short); }
  body[data-mode="long"] { --accent: var(--c-long); }
  body[data-mode="stopwatch"] { --accent: var(--c-watch); }

  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--text); user-select: none; }
  .mini {
    position: absolute; inset: 4px; display: flex; align-items: center; gap: 4px; padding: 0 6px 0 14px;
    border-radius: 12px; overflow: hidden; background: var(--surface); border: 1px solid var(--line);
    -webkit-app-region: drag; /* arrastar a janela */
  }
  .track { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--track); }
  .prog { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--accent); transition: width .3s linear; }
  .info { flex: 1; min-width: 0; }
  .time { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; font-size: 24px; font-weight: 400; line-height: 1; font-variant-numeric: tabular-nums; }
  .lbl { margin-top: 3px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { -webkit-app-region: no-drag; flex: none; display: grid; place-items: center; border: 0; padding: 0; cursor: pointer; color: var(--muted); background: transparent; border-radius: 7px; width: 26px; height: 26px; }
  button:hover { background: var(--hover); color: var(--text); }
  button svg { width: 14px; height: 14px; }
  .play { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--on-accent); margin-right: 2px; }
  .play:hover { background: var(--accent); color: var(--on-accent); filter: brightness(1.06); }
  .play svg { width: 15px; height: 15px; }
  .x svg { width: 11px; height: 11px; }
</style>
</head>
<body data-mode="pomodoro">
  <div class="mini">
    <div class="info">
      <div class="time" id="time">--:--</div>
      <div class="lbl" id="lbl">Focus</div>
    </div>
    <button class="play" id="play" title="Iniciar / pausar"></button>
    <button id="skip" title="Pular"><svg viewBox="0 0 24 24"><path d="M3.5 6v12l7.5-6zM11 6v12l7.5-6z" fill="currentColor"/><rect x="18.5" y="6" width="2.2" height="12" rx="1.1" fill="currentColor"/></svg></button>
    <button id="open" title="Abrir o Focus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-8 8"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
    <button class="x" id="close" title="Fechar mini-timer"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="track"></div>
    <div class="prog" id="prog"></div>
  </div>
<script>
  'use strict';
  const PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.8l10.2-6.8a1 1 0 0 0 0-1.6L9.6 4.4c-.7-.5-1.6 0-1.6.8z" fill="currentColor"/></svg>';
  const PAUSE = '<svg viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.3" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.3" fill="currentColor"/></svg>';
  const el = (id) => document.getElementById(id);
  el('play').innerHTML = PLAY;

  if (window.desktop) {
    desktop.onState((s) => {
      document.body.dataset.mode = s.mode;
      el('time').textContent = s.text;
      el('lbl').textContent = s.started && !s.running ? 'Pausado' : (s.task || s.label);
      el('lbl').title = s.task ? `${s.label} · ${s.task}` : s.label;
      el('play').innerHTML = s.running ? PAUSE : PLAY;
      el('prog').style.width = (s.progress >= 0 ? s.progress * 100 : 0) + '%';
    });
    el('play').onclick = () => desktop.command('toggle');
    el('skip').onclick = () => desktop.command('skip');
    el('open').onclick = () => desktop.command('show');
    el('close').onclick = () => desktop.command('close-mini');
  }
</script>
</body>
</html>
